[project]
name = "neural-ode-rank-experiments"
version = "0.1.0"
description = "Monte Carlo singular spectra and rank comparisons of neural ODE parameter derivatives"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
